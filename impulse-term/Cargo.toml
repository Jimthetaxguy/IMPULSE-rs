[package]
name = "impulse-term"
version = "0.1.0"
edition = "2021"
description = "Custom terminal widget for Impulse GUI with context lifecycle integration"
authors = ["James Pustorino"]
license = "MIT"

[dependencies]
portable-pty = "0.9"
vt100 = "0.15"
eframe = "0.31"
parking_lot = "0.12"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
