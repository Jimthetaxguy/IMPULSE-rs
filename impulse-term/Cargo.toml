[package]
name = "impulse-term"
version = "0.1.0"
edition = "2021"
description = "Custom terminal widget for Impulse GUI with context lifecycle integration"
authors = ["James Pustorino"]
license = "MIT"

[dependencies]
# Core terminal backend (PTY + vt100 parser + context bridge) — toolkit-neutral.
impulse-term-core = { path = "../impulse-term-core" }

# Re-exported through impulse-term-core, but renderer.rs and panel.rs in this
# crate still touch vt100::Color directly until L158 extracts TermColor.
vt100 = "0.15"

# Egui adapter dependencies (this crate is the egui adapter for impulse-term-core).
eframe = "0.31"
log = "0.4"
serde = { version = "1", features = ["derive"] }

# Used by panel.rs / status_bar.rs (egui adapter files) for FairMutex guards
# returned across the panel API surface, and chrono timestamps in status UI.
# These remain because the API surface of the egui panel exposes them; once
# the egui shell is retired (post-L179), this crate goes away entirely.
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
