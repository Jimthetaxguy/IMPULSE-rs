[package]
name = "impulse-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Dioxus cockpit and typed desktop-host contracts for Impulse"
authors = ["Impulse Maintainers"]
license = "MIT"

[lib]
name = "impulse_desktop"
path = "src/lib.rs"

[[bin]]
name = "impulse-desktop"
path = "src/bin/impulse_desktop.rs"
required-features = ["desktop-app"]

[[example]]
name = "emit_dioxus_host_bootstrap"
path = "examples/emit_dioxus_host_bootstrap.rs"
required-features = ["desktop-app"]

[features]
default = []
desktop-app = ["dep:dioxus-desktop", "dioxus/desktop", "dep:rfd"]
native-macos = [
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
]
# Legacy compatibility adapter for older Tauri-shaped host integrations.
legacy-tauri-runtime = ["dep:tauri"]
tauri-runtime = ["legacy-tauri-runtime"]

[dependencies]
dioxus = { version = "0.6.3", default-features = false, features = ["minimal", "document"] }
dioxus-desktop = { version = "0.6.3", optional = true }
impulse-ops = { path = "../impulse-ops" }
impulse-term = { path = "../impulse-term", default-features = false }
rfd = { version = "0.14", optional = true, default-features = false, features = ["xdg-portal", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt"] }
tauri = { version = "2.11.2", optional = true, default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.3", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["NSString"] }

[dev-dependencies]
dioxus-ssr = "0.6.0"
generational-box = "0.6.2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
