[package]
name = "impulse-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Hybrid Dioxus desktop shell contracts for Impulse"
authors = ["James Pustorino"]
license = "MIT"

[lib]
name = "impulse_desktop"
path = "src/lib.rs"

[features]
default = []
native-macos = [
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
]
tauri-runtime = ["dep:tauri"]

[dependencies]
dioxus = { version = "0.6.3", default-features = false, features = ["minimal", "document"] }
impulse-ops = { path = "../impulse-ops" }
impulse-term = { path = "../impulse-term", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tauri = { version = "2.11.2", optional = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.3", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["NSString"] }

[dev-dependencies]
dioxus-ssr = "0.6.0"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
