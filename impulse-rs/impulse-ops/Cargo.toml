[package]
name = "impulse-ops"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Shared control-plane protocol and models for Impulse"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
