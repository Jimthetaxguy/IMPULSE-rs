[workspace]
members = [
    ".",
    "impulse-desktop",
    "impulse-ion",
    "impulse-ops",
    "impulse-step-model",
    "impulse-term",
]
exclude = ["impulse-gui"]

[package]
name = "impulse-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Terminal-native local control plane and harness manager for AI coding agents"
authors = ["Impulse Maintainers"]
license = "MIT"
default-run = "impulse-rs"

[lib]
name = "impulse_rs"
path = "src/lib.rs"

[[bin]]
name = "impulse-rs"
path = "src/main.rs"

[[bin]]
name = "ion"
path = "src/bin/ion.rs"

[package.metadata.bundle]
name = "Impulse"
identifier = "com.impulse.ai"
category = "Developer Tool"
short_description = "Terminal-native AI agent control plane"
long_description = "Feed the impulse to build with a local harness manager for governed coding-agent runtimes, shared tools, memory, telemetry, and verification."

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Terminal UI
ratatui = "0.28"
crossterm = "0.28"

# HTTP/API calls
reqwest = { version = "0.12", features = ["json", "blocking"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled", "load_extension"] }
sha2 = "0.10"
impulse-ops = { path = "impulse-ops" }
impulse-ion = { path = "impulse-ion" }
impulse-step-model = { path = "impulse-step-model" }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUID for session IDs
uuid = { version = "1", features = ["v4", "serde"] }

# File operations
dirs = "6"
glob = "0.3"
tempfile = "3"

# Pattern matching
regex = "1"
levenshtein = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Async traits
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }

# Readline REPL (ion binary, TUI_SPEC.md T6). TUI_SPEC.md floated "15" as a
# candidate pin; 18 is the current major on crates.io as of this task and
# resolves/builds cleanly against this workspace's MSRV (1.82), so we pin to
# the current major instead of the stale suggestion.
rustyline = "18"

# Dynamic command execution
portable-pty = "0.9"
vt100 = "0.15"
which = "7"

# Monty Python interpreter integration (optional)
# Uses pyo3 to call pydantic-monty for computed routing
# Enable with --features monty-support
pyo3 = { version = "0.29.0", optional = true, features = ["extension-module"] }

# DataFusion for advanced analytics (optional)
# Enable with --features datafusion-support
datafusion = { version = "43", optional = true }

# Office document handling (optional)
# Enable with --features office-support
calamine = { version = "0.26", optional = true }
rust_xlsxwriter = { version = "0.7", optional = true }
docx = { version = "0.4", optional = true, package = "docx-rs" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Keep Impulse's Rust 1.82 MSRV: security-framework 3.7 requires Rust 1.85.
security-framework = "=3.6.0"
security-framework-sys = "=2.17.0"

[features]
default = ["office-support"]
# Monty support enables computed routing and dynamic context injection
# Requires: pip install pydantic-monty
monty-support = ["dep:pyo3"]
# DataFusion support enables advanced analytics and aggregation
datafusion-support = ["dep:datafusion"]
# Office support enables document parsing and generation
# Supports: Excel (.xlsx), Word (.docx), CSV
office-support = ["dep:calamine", "dep:rust_xlsxwriter", "dep:docx"]

[dev-dependencies]
filetime = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
