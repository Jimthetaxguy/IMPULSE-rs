[package]
name = "impulse-gui-legacy-adapter"
version = "0.1.0"
edition = "2021"
description = "Legacy egui adapter for impulse-term"
authors = ["James Pustorino"]
license = "MIT"

[dependencies]
impulse-term = { path = "../impulse-term" }
eframe = "0.31"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
parking_lot = "0.12"
vt100 = "0.15"

[dev-dependencies]
serde_json = "1"
