[package]
name = "impulse-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Impulse GUI - Native terminal multiplexer for AI coding agents"
authors = ["James Pustorino"]
license = "MIT"

[[bin]]
name = "impulse-gui"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
impulse-ops = { path = "../impulse-ops" }
impulse-term-core = { path = "../impulse-term-core" }
impulse-term = { path = "../impulse-term" }
which = "7"
env_logger = "0.11"
log = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "3", features = ["json"] }
rfd = "0.15"
dirs = "6"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
