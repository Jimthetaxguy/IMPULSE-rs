name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-13
            artifact: impulse-rs-darwin-x86_64
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact: impulse-rs-darwin-aarch64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: impulse-rs-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: impulse-rs-linux-aarch64
            cross: true
    defaults:
      run:
        working-directory: impulse-rs
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impulse-rs

      - name: Install cross-compilation tools
        if: matrix.cross
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross && 'aarch64-linux-gnu-gcc' || '' }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/impulse-rs ../${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-dmg:
    name: Build and smoke Dioxus macOS App (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impulse-rs

      - name: Test cross-platform packaging contract
        working-directory: impulse-rs
        run: cargo test --locked -p impulse-desktop --test macos_packaging_contract

      - name: Build, verify, and smoke universal Dioxus bundle + DMG
        working-directory: impulse-rs
        env:
          VERSION: ${{ github.ref_name }}
        run: bash scripts/build-macos-app.sh --universal --dmg --smoke --version "${VERSION#v}"

      - name: Upload package smoke evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: impulse-dioxus-smoke-failure
          path: impulse-rs/target/package-smoke
          if-no-files-found: ignore

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: impulse-dioxus-developer-preview-dmg
          path: impulse-rs/target/package/Impulse-*.dmg

  release:
    name: Create Release
    needs: [build-cli, build-dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
