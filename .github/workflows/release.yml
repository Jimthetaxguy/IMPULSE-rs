name: Release Readiness (manual, no retained artifacts)
run-name: Manual release-readiness proof for ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Exact-commit locked gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impulse-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impulse-rs
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  build-cli-candidate:
    name: CLI candidate (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: impulse-rs-linux-x86_64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            artifact: impulse-rs-darwin-x86_64
          - target: aarch64-apple-darwin
            runner: macos-15
            artifact: impulse-rs-darwin-aarch64
    defaults:
      run:
        working-directory: impulse-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impulse-rs
      - name: Build explicit control-plane and native Ion binaries
        run: cargo build --locked --release --target ${{ matrix.target }} -p impulse-rs --bin impulse-rs --bin ion
      - name: Assemble and inspect mode-preserving preview
        run: |
          mkdir -p ../candidate/${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/impulse-rs ../candidate/${{ matrix.artifact }}/impulse-rs
          cp target/${{ matrix.target }}/release/ion ../candidate/${{ matrix.artifact }}/ion
          chmod 0755 ../candidate/${{ matrix.artifact }}/impulse-rs ../candidate/${{ matrix.artifact }}/ion
          cp impulse-desktop/resources/ReleaseCandidateNotice.txt ../candidate/${{ matrix.artifact }}/
          tar -C ../candidate -czf ../candidate/${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}
          mkdir -p ../candidate/extracted/${{ matrix.artifact }}
          tar -xzf ../candidate/${{ matrix.artifact }}.tar.gz -C ../candidate/extracted
          test -x ../candidate/extracted/${{ matrix.artifact }}/impulse-rs
          test -x ../candidate/extracted/${{ matrix.artifact }}/ion
          shasum -a 256 ../candidate/${{ matrix.artifact }}.tar.gz

  build-dioxus-candidate:
    name: Universal non-distributable Dioxus candidate
    needs: verify
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: impulse-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impulse-rs
      - name: Lint active Dioxus desktop binary
        run: cargo clippy -p impulse-desktop --features desktop-app --bin impulse-desktop --locked -- -D warnings
      - run: cargo test -p impulse-desktop --test macos_packaging_contract --locked
      - name: Build and inspect universal developer-preview DMG
        env:
          CARGO_TARGET_DIR: target/release-candidate
        run: |
          bash scripts/build-macos-app.sh --universal --dmg
          shasum -a 256 target/release-candidate/package/*non-distributable-developer-preview.dmg
