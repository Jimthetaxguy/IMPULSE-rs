name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'impulse-rs/**'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            artifact: impulse-rs-darwin-x86_64
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact: impulse-rs-darwin-aarch64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: impulse-rs-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            artifact: impulse-rs-linux-aarch64
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/impulse-rs/target
      CLI_TARGET: ${{ matrix.target }}
      CLI_ARTIFACT: ${{ matrix.artifact }}
    defaults:
      run:
        shell: bash
        working-directory: impulse-rs
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impulse-rs

      - name: Build CLI
        run: cargo build --locked --release --bin impulse-rs --target "$CLI_TARGET"

      - name: Stage and smoke-test CLI artifact
        run: |
          cp "$CARGO_TARGET_DIR/$CLI_TARGET/release/impulse-rs" "../$CLI_ARTIFACT"
          test -x "../$CLI_ARTIFACT"
          file "../$CLI_ARTIFACT"
          "../$CLI_ARTIFACT" --help
          "../$CLI_ARTIFACT" daemon --help
          "../$CLI_ARTIFACT" mcp serve --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  package-cli:
    name: Verify CLI release assets
    needs: build-cli
    runs-on: ubuntu-latest
    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: impulse-rs-*
          path: artifacts
          merge-multiple: true

      - name: Generate and verify checksums
        working-directory: artifacts
        run: |
          sha256sum impulse-rs-darwin-x86_64 impulse-rs-darwin-aarch64 \
            impulse-rs-linux-x86_64 impulse-rs-linux-aarch64 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: impulse-cli-release
          if-no-files-found: error
          path: |
            artifacts/impulse-rs-darwin-x86_64
            artifacts/impulse-rs-darwin-aarch64
            artifacts/impulse-rs-linux-x86_64
            artifacts/impulse-rs-linux-aarch64
            artifacts/SHA256SUMS.txt

  release:
    name: Create Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package-cli
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: impulse-cli-release
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            This release contains the impulse-rs CLI for macOS and Linux (Intel/Apple silicon and x86_64/ARM64 respectively), plus SHA-256 checksums.
            Desktop app bundles and DMGs are unavailable until the Dioxus packaging and launch gates in docs/plans/EGUI-DECOMMISSION.md are satisfied.
          files: |
            artifacts/impulse-rs-darwin-x86_64
            artifacts/impulse-rs-darwin-aarch64
            artifacts/impulse-rs-linux-x86_64
            artifacts/impulse-rs-linux-aarch64
            artifacts/SHA256SUMS.txt
