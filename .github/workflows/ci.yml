name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: impulse-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impulse-rs
      - name: Test (default features, includes office-support)
        run: cargo test
      - name: Test lib (minimal, no default features)
        run: cargo test --no-default-features --lib

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impulse-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impulse-rs
      - run: cargo clippy -- -D warnings
      - run: cargo fmt --check

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impulse-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impulse-rs
      - name: Build (default features, includes office-support)
        run: cargo build --release
      - name: Build (minimal, no default features)
        run: cargo build --no-default-features

  desktop-release:
    # The Dioxus cockpit is feature-gated (`desktop-app`), so the jobs above
    # never compile it, and the verification gate builds only debug. Release
    # builds borrow-check `rsx!` `key:` expansions differently, which once
    # left main unable to package the app while every other check was green.
    name: Desktop app (release check, macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: impulse-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impulse-rs
      - name: Check impulse-desktop with the desktop host in release mode
        run: cargo check --release -p impulse-desktop --features desktop-app
