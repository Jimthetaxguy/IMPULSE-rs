# Impulse Project Metadata

## Project Identity

| Field | Value |
|-------|-------|
| Name | Impulse |
| Tagline | "Feed the impulse to build." |
| Type | Lightweight, terminal-native coding-agent harness and local control plane |
| Language | Rust |
| Status | Pre-release active development |

Impulse hosts heterogeneous coding runtimes inside one governed environment. Dioxus is the
desktop cockpit, ratatui is the terminal-only cockpit, roles define behavior, runtime adapters
launch workers, the daemon owns durable control-plane state, and memory is one curated platform
service rather than the whole product.

