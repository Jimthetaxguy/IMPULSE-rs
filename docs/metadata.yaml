## File Structure

```
impulse-rs/
├── src/
│   ├── main.rs           # CLI entry
│   ├── state/mod.rs     # State management
│   ├── daemon/mod.rs    # Unix socket server
│   ├── client/mod.rs   # Daemon client
│   ├── storage/mod.rs  # Atomic file ops
│   ├── ui/mod.rs       # Ratatui TUI
│   ├── memory/mod.rs   # GENOME system
│   ├── agent/          # LLM providers
│   └── error.rs        # Error types
└── .impulse/           # Runtime data
    ├── LIVE_STATE.json
    ├── HISTORY.jsonl
    ├── GENOME.md
    └── sockets/
```

