## Architecture

dual_mode:
  direct:
    description: "Bounded CLI operations and runtime adapters"
    use_case: "Hooks, explicit control commands, and external coding-agent launch surfaces"
    flow: "request → validate role and scope → execute → publish evidence"
    
  daemon:
    description: "Long-running local control-plane authority"
    use_case: "Durable tasks, review state, telemetry, memory, and cockpit subscriptions"
    socket_path: ".impulse/sockets/impulse.sock"
    features:
      - "Daemon-owned governed task lifecycle"
      - "Structured operations snapshots and subscriptions"
      - "Atomic persistence and local Unix-socket IPC"
      - "Accepted-run memory candidates with explicit review boundaries"

product_layers:
  - "Dioxus desktop cockpit and ratatui terminal cockpit"
  - "Supervisor, Builder, and review role contracts"
  - "Claude Code, Codex, shell, Ion, and future runtime adapters"
  - "PTY/process supervision and typed tools"
  - "Daemon-owned tasks, evidence, review, and telemetry"
  - "Scoped memory, artifacts, and context"

data_files:
  - name: LIVE_STATE.json
    purpose: "Active sessions, files, tools"
    persistence: "Ephemeral (gitignored)"
    
  - name: HISTORY.jsonl
    purpose: "Session history (append-only)"
    persistence: "Git-committed"
    
  - name: GENOME.md
    purpose: "Permanent decisions, preferences"
    persistence: "Git-committed"

## Technology Stack

| Component | Technology | Version |
|----------|------------|---------|
| Language | Rust | stable |
| CLI Parser | clap | 4.x |
| TUI | ratatui | 0.28 |
| Desktop shell | Dioxus Desktop + xterm.js | active primary path |
| Legacy host adapter | Tauri-shaped bridge | compatibility only |
| Legacy desktop | egui / impulse-gui | default-inactive; physical retirement gated |
| Async | tokio | 1.x |
| Control IPC | newline-delimited JSON over local Unix sockets | protocol-versioned |
| Packaging | signed macOS `.app` plus companion `impulse-rs` | developer preview |

## Runtime and Model Integrations

llm_providers:
  - name: Anthropic
    status: "API adapter implemented; capability depth varies by path"
      
  - name: OpenAI
    status: "API adapter implemented; tool-calling parity is not complete"
      
  - name: MiniMax
    status: "API adapter plus Ion/Pi verification path implemented; production proof is separately gated"

external_runtimes:
  - "Claude Code"
  - "Codex CLI"
  - "Generic shell"

Runtime presence does not imply equal enforcement. Role compatibility and capability negotiation
must fail closed when a mandatory control cannot be satisfied.

## Roadmap Phases

phases:
  - name: Now
    focus: "Dioxus cockpit, governed Builder flow, daemon-owned evidence, review, packaged live-host proof"
    status: active
    
  - name: Next
    focus: "A truly launched Supervisor runtime, stronger actor authorization, and complete Builder/Supervisor end-to-end proof"
    status: planned
    
  - name: Later
    focus: "Generalized roles, negotiated runtimes, multi-project routing, and explicit memory promotion/dismissal"
    status: planned

## Commands

The executable CLI is authoritative. Use `impulse-rs --help` and
[`CLI-COMMANDS.md`](CLI-COMMANDS.md); this metadata file deliberately does not duplicate a
drift-prone command inventory.

## File Structure

```
impulse-rs/
├── impulse-desktop/     # Dioxus cockpit, host bridge, PTY lifecycle
├── impulse-ops/         # Typed control-plane and governed-task contracts
├── impulse-ion/         # Native verification/runtime integration
├── impulse-term/        # Framework-neutral terminal engine
├── impulse-tui/         # Ratatui cockpit
├── impulse-gui/         # Default-inactive EGUI legacy surface pending gated removal
├── src/                 # CLI, daemon, persistence, memory, providers, tools
└── scripts/             # Packaging and verification entry points
```

