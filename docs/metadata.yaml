## Architecture

dual_mode:
  direct:
    description: "Per-action, stateless"
    use_case: "CLI hooks for Claude Code/Codex; legacy OpenCode compatibility where already implemented"
    flow: "read → process → write → exit"
    
  daemon:
    description: "Long-running"
    use_case: "TUI, interactive chat"
    socket_path: ".impulse/sockets/impulse.sock"
    features:
      - "In-memory state"
      - "Periodic file sync"
      - "Unix socket IPC"

data_files:
  - name: LIVE_STATE.json
    purpose: "Active sessions, files, tools"
    persistence: "Ephemeral (gitignored)"
    
  - name: HISTORY.jsonl
    purpose: "Session history (append-only)"
    persistence: "Git-committed"
    
  - name: GENOME.md
    purpose: "Permanent decisions, preferences"
    persistence: "Git-committed"

## Technology Stack

